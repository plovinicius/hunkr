[package]
name = "hunkr"
version = "0.1.0"
edition = "2024"
description = "A fast, terminal-first git diff reviewer built for AI coding workflows"
authors = ["Paulo Pinheiro <ploviniciusplo@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/plovinicius/hunkr"
homepage = "https://github.com/plovinicius/hunkr"
readme = "README.md"
keywords = ["git", "diff", "tui", "review", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
arboard = "3.6.1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
notify = "8.2.0"
ratatui = "0.29"
regex = "1"
seahash = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
